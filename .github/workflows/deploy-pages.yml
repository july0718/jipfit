name: Deploy Jipfit to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 22 1 * *' # 2nd day of each month, 07:30 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jipfit-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 코드 받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 시설 공개자료 갱신
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          TDATA_SUBWAY_API_KEY: ${{ secrets.TDATA_SUBWAY_API_KEY }}
        run: python tools/refresh-facilities.py

      - name: 월간 단지 기본정보 갱신
        if: github.event_name == 'schedule'
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          node tools/monthly-metadata.mjs "https://${PAGES_PROJECT}.pages.dev" frontend/public/metadata
          git add frontend/public/metadata frontend/facilities
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh monthly complex metadata"
            git push origin HEAD:main
          fi

      - name: React 빌드 및 Pages 배포 폴더 준비
        working-directory: frontend
        run: |
          npm install --include=dev --no-audit --no-fund
          npm run build
          cp index.html style.css config.js _worker.js dist/

      - name: 검증된 광진구 오차 참고범위 JSON 내보내기
        run: python tools/export_historical_reference.py frontend/dist/metadata/forecast-reference.json

      - name: 기존 Cloudflare Pages 프로젝트에 배포
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          npx --yes wrangler@4.165.0 pages deploy "$GITHUB_WORKSPACE/frontend/dist" \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA"
