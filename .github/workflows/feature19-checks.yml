name: Forecast chart checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/main.py"
      - "backend/complex_list.py"
      - "backend/accounts.py"
      - "backend/refresh.py"
      - "backend/automatic_metadata.py"
      - "backend/refresh_metadata.py"
      - "backend/fetch_macro.py"
      - "backend/db/**"
      - "backend/facilities.py"
      - "backend/facilities_seed/**"
      - "backend/reference_band.py"
      - "backend/test_*.py"
      - "backend/Dockerfile"
      - "backend/evaluate_seoul_holdout.py"
      - "backend/seoul_reference.py"
      - ".gitignore"
      - "tools/export_historical_reference.py"
      - "tools/test_export_historical_reference.py"
      - ".github/workflows/feature19-checks.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node tests
        working-directory: frontend
        run: node --test *.test.mjs
      - name: React build
        working-directory: frontend
        run: |
          npm install --include=dev --no-audit --no-fund
          npm run build
      - name: Frontend Docker build
        run: docker build frontend -t jipfit-feature19-web
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install numpy pandas joblib openpyxl "psycopg[binary]"
      - name: Backend unit tests
        working-directory: backend
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Validate optional published Seoul aggregate
        run: |
          if [ -f frontend/public/metadata/seoul-forecast-reference.json ]; then
            python backend/seoul_reference.py frontend/public/metadata/seoul-forecast-reference.json
          else
            echo "Awaiting real Seoul holdout; no fabricated distribution."
          fi
      - name: Static JSON exporter tests
        run: python -m unittest discover -s tools -p 'test_export_historical_reference.py' -v
      - name: Verify production audit static export
        run: |
          python tools/export_historical_reference.py /tmp/forecast-reference.json
          python -c "import json; p=json.load(open('/tmp/forecast-reference.json')); assert [x['sample_count'] for x in p['horizons']] == [1510,1143,535]; assert p['calibrated_for_current_model'] is False"
