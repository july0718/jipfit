services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      JIPFIT_DOMAIN: ${JIPFIT_DOMAIN:?Set the public hostname in .env}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
  db:
    restart: unless-stopped
  api:
    restart: unless-stopped
  web:
    restart: unless-stopped
volumes:
  certificates:
