services:
  db:
    image: postgres:18
    working_dir: /docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: jipfit
      POSTGRES_USER: jipfit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "jipfit", "-d", "jipfit"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - jipfit_pg:/var/lib/postgresql
      - ./backend/db:/docker-entrypoint-initdb.d:ro
  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: jipfit
      PGUSER: jipfit
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: ./frontend
    volumes:
      - ./frontend/public/data:/usr/share/nginx/html/data:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
  snapshot:
    profiles: ["snapshots"]
    build: ./backend
    command: ["python", "export_public_json.py", "--out", "/export"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: jipfit
      PGUSER: jipfit
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./frontend/public/data:/export
  updater:
    profiles: ["updates"]
    build: ./backend
    command: ["python", "-u", "refresh.py"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: jipfit
      PGUSER: jipfit
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MOLIT_SERVICE_KEY: ${MOLIT_SERVICE_KEY:-}
  public-updater:
    profiles: ["public-updates"]
    build: ./backend
    command: ["python", "-u", "run_public_updates.py"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: jipfit
      PGUSER: jipfit
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MOLIT_SERVICE_KEY: ${MOLIT_SERVICE_KEY:-}
      JIPFIT_PUBLISH_R2: ${JIPFIT_PUBLISH_R2:-0}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    volumes:
      - ./frontend/public/data:/export
      - ./verified-metadata:/metadata:ro
volumes:
  jipfit_pg:




